      <line x1="472" y1="760" x2="360" y2="300"
            stroke="#c46865" stroke-width="1.4" opacity="0.61"/>
      <line x1="584" y1="760" x2="360" y2="300"
            stroke="#c46865" stroke-width="1.4" opacity="0.52"/>
      <line x1="696" y1="760" x2="360" y2="300"
