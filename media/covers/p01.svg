<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#863333"/>
      <stop offset="1" stop-color="#491d1f"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#d49190" stop-opacity=".85"/>
      <stop offset="1" stop-color="#d49190" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#281115" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#281115" stop-opacity=".72"/>
      <stop offset="1" stop-color="#281115" stop-opacity=".97"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="1176" fill="url(#bg)"/>
  
    <g opacity=".38">
      
      <line x1="-200" y1="760" x2="360" y2="300"
