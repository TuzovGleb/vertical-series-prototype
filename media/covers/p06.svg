<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#675027"/>
      <stop offset="1" stop-color="#392d19"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#bba986" stop-opacity=".85"/>
      <stop offset="1" stop-color="#bba986" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201911" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#201911" stop-opacity=".72"/>
      <stop offset="1" stop-color="#201911" stop-opacity=".97"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="1176" fill="url(#bg)"/>
  
    <g fill="none" opacity=".5">
      
      <path d="M 230 560 A 130 130 0 0 1 490 560"
            stroke="#a18859" stroke-width="2.5"
            opacity="0.65"/>
      <path d="M 150 560 A 210 210 0 0 1 570 560"
            stroke="#bba986" stroke-width="2.2"
            opacity="0.55"/>
      <path d="M 70 560 A 290 290 0 0 1 650 560"
            stroke="#a18859" stroke-width="1.9"
            opacity="0.45"/>
      <path d="M -10 560 A 370 370 0 0 1 730 560"
            stroke="#bba986" stroke-width="1.6"
            opacity="0.35"/>
      <path d="M -90 560 A 450 450 0 0 1 810 560"
            stroke="#a18859" stroke-width="1.3"
            opacity="0.25"/>
    </g>
  <rect width="720" height="1176" filter="url(#grain)" opacity=".05"/>
  <rect y="494" width="720" height="682" fill="url(#fade)"/>

  
    <text x="52" y="572" font-size="68" font-weight="800"
          letter-spacing="-1" fill="#fff">НАСЛЕДСТВО В</text>
    <text x="52" y="648" font-size="68" font-weight="800"
          letter-spacing="-1" fill="#fff">КИМРАХ</text>
</svg>
