<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#822d46"/>
      <stop offset="1" stop-color="#471a2a"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#d18d9f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#d18d9f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27101a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#27101a" stop-opacity=".72"/>
      <stop offset="1" stop-color="#27101a" stop-opacity=".97"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="1176" fill="url(#bg)"/>
  
    <g opacity=".5">
      
      <rect x="-260" y="-200" width="54" height="1700"
            fill="#c0617b" opacity="0.1"
            transform="rotate(24 360 588)"/>
      <rect x="-110" y="-200" width="54" height="1700"
            fill="#d18d9f" opacity="0.14500000000000002"
            transform="rotate(24 360 588)"/>
      <rect x="40" y="-200" width="54" height="1700"
            fill="#c0617b" opacity="0.19"
            transform="rotate(24 360 588)"/>
      <rect x="190" y="-200" width="54" height="1700"
            fill="#d18d9f" opacity="0.23500000000000001"
            transform="rotate(24 360 588)"/>
      <rect x="340" y="-200" width="54" height="1700"
            fill="#c0617b" opacity="0.28"
            transform="rotate(24 360 588)"/>
      <rect x="490" y="-200" width="54" height="1700"
            fill="#d18d9f" opacity="0.32499999999999996"
            transform="rotate(24 360 588)"/>
    </g>
  <rect width="720" height="1176" filter="url(#grain)" opacity=".05"/>
  <rect y="494" width="720" height="682" fill="url(#fade)"/>

  
    <text x="52" y="572" font-size="68" font-weight="800"
          letter-spacing="-1" fill="#fff">БИЛЕТ В ОДИН</text>
    <text x="52" y="648" font-size="68" font-weight="800"
          letter-spacing="-1" fill="#fff">КОНЕЦ</text>
</svg>
