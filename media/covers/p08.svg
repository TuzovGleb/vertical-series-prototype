<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8f4f2f"/>
      <stop offset="1" stop-color="#4e2c1d"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#dca78d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#dca78d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1914" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#2b1914" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2b1914" stop-opacity=".97"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="1176" fill="url(#bg)"/>
  
    <g opacity=".62" filter="url(#soft)">
      <ellipse cx="250" cy="420" rx="150" ry="205" fill="#ce8661" opacity=".5"/>
      <ellipse cx="470" cy="520" rx="120" ry="175" fill="#dca78d" opacity=".38"/>
      <ellipse cx="360" cy="300" rx="200" ry="120" fill="#ce8661" opacity=".22"/>
    </g>
  <rect width="720" height="1176" filter="url(#grain)" opacity=".05"/>
  <rect y="494" width="720" height="682" fill="url(#fade)"/>

  
    <text x="52" y="484" font-size="74" font-weight="800"
          letter-spacing="-1" fill="#fff">АВТОСЕРВИС</text>
    <text x="52" y="566" font-size="74" font-weight="800"
          letter-spacing="-1" fill="#fff">НА</text>
    <text x="52" y="648" font-size="74" font-weight="800"
          letter-spacing="-1" fill="#fff">КОЖУХОВСКОЙ</text>
</svg>
