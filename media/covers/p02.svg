<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#315e77"/>
      <stop offset="1" stop-color="#1c3443"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#90b4c7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#90b4c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d28" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#111d28" stop-opacity=".72"/>
      <stop offset="1" stop-color="#111d28" stop-opacity=".97"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="1176" fill="url(#bg)"/>
  
    <circle cx="360" cy="430" r="215" fill="url(#orb)"/>
    <circle cx="360" cy="430" r="215" fill="none" stroke="#90b4c7" stroke-width="1.5" opacity=".55"/>
    <circle cx="360" cy="430" r="290" fill="none" stroke="#6597b1" stroke-width="1" opacity=".25"/>
  <rect width="720" height="1176" filter="url(#grain)" opacity=".05"/>
  <rect y="494" width="720" height="682" fill="url(#fade)"/>

  
    <text x="52" y="562" font-size="78" font-weight="800"
          letter-spacing="-1" fill="#fff">СЕВЕРНАЯ</text>
    <text x="52" y="648" font-size="78" font-weight="800"
          letter-spacing="-1" fill="#fff">НАДБАВКА</text>
</svg>
